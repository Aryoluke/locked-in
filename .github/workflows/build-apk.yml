name: Build Android APK

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # This repository currently contains the Flutter/Dart source but no
      # checked-in Android wrapper. Generate it on the runner before building.
      - name: Generate Android platform wrapper when needed
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name locked_in --org com.aryoluke .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Create Android platform project
        run: flutter create --platforms=android --project-name locked_in --org com.aryoluke .

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: locked-in-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged APK release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: LOCKED IN ${{ github.ref_name }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
